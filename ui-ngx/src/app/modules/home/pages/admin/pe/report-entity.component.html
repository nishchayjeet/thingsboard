<div class="mat-padding flex flex-col">
  <form [formGroup]="entityForm">
    <fieldset [disabled]="(isLoading$ | async) || !isEdit">
      <mat-form-field class="mat-block" appearance="outline">
        <mat-label translate>report.name</mat-label>
        <input matInput formControlName="name" required maxlength="255"/>
      </mat-form-field>

      <mat-form-field class="mat-block" appearance="outline">
        <mat-label translate>report.dashboard</mat-label>
        <input matInput formControlName="dashboardIdRaw" required placeholder="Dashboard UUID"/>
      </mat-form-field>

      <mat-form-field class="mat-block" appearance="outline">
        <mat-label>Dashboard state ID (optional)</mat-label>
        <input matInput formControlName="stateId"/>
      </mat-form-field>

      <mat-form-field class="mat-block" appearance="outline">
        <mat-label translate>report.format</mat-label>
        <mat-select formControlName="format" required>
          <mat-option value="PDF">PDF</mat-option>
          <mat-option value="PNG">PNG</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="mat-block" appearance="outline">
        <mat-label>Timezone</mat-label>
        <input matInput formControlName="timezone" placeholder="UTC"/>
      </mat-form-field>

      <mat-form-field class="mat-block" appearance="outline">
        <mat-label translate>report.recipients</mat-label>
        <textarea matInput formControlName="recipientsRaw" cdkTextareaAutosize cdkAutosizeMinRows="2"
                  placeholder="Comma-separated email addresses"></textarea>
      </mat-form-field>

      <mat-checkbox formControlName="useDashboardTimewindow">Use dashboard timewindow</mat-checkbox>
    </fieldset>
  </form>
</div>
