<div class="mat-padding flex flex-col">
  <form [formGroup]="entityForm">
    <fieldset [disabled]="(isLoading$ | async) || !isEdit">
      <mat-form-field class="mat-block" appearance="outline">
        <mat-label translate>converter.name</mat-label>
        <input matInput formControlName="name" required maxlength="255"/>
      </mat-form-field>

      <mat-form-field class="mat-block" appearance="outline">
        <mat-label translate>converter.type</mat-label>
        <mat-select formControlName="type" required>
          <mat-option value="UPLINK">{{ 'converter.uplink' | translate }}</mat-option>
          <mat-option value="DOWNLINK">{{ 'converter.downlink' | translate }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-checkbox formControlName="debugMode">{{ 'converter.debug-mode' | translate }}</mat-checkbox>

      <mat-form-field class="mat-block" appearance="outline">
        <mat-label>Script language</mat-label>
        <mat-select formControlName="scriptLang">
          <mat-option value="JS">JavaScript</mat-option>
          <mat-option value="TBEL">TBEL</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="mat-block" appearance="outline">
        <mat-label>Decoder (uplink)</mat-label>
        <textarea matInput formControlName="decoder" rows="10"
                  style="font-family: monospace; font-size: 12px;"
                  placeholder="function Decoder(payload, metadata) { return { telemetry: {}, attributes: {} }; }"></textarea>
      </mat-form-field>

      <mat-form-field class="mat-block" appearance="outline">
        <mat-label>Encoder (downlink)</mat-label>
        <textarea matInput formControlName="encoder" rows="6"
                  style="font-family: monospace; font-size: 12px;"></textarea>
      </mat-form-field>
    </fieldset>
  </form>
</div>
